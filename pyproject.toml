[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axon"
version = "0.1.0"
description = "Axon — Agentic SDLC orchestration platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
